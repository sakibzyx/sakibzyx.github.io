<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2c3e50" />
    <title>Gallery | Md Sakibul Hasan</title>
    <meta name="description" content="Photo gallery of Md Sakibul Hasan, Civil Engineering student at DUET: projects, certificates and site visits." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://sakibzyx.github.io/gallery" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sakibzyx.github.io/gallery" />
    <meta property="og:title" content="Gallery | Md Sakibul Hasan" />
    <meta property="og:image" content="https://sakibzyx.github.io/assets/img/og-image.jpg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/webp" href="/assets/img/md-sakibul-hasan.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" /></noscript>
    <link rel="stylesheet" href="/assets/css/gallery.css" />
  </head>

  <body>
    <a class="visually-hidden-focusable" href="#main">Skip to main content</a>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top" aria-label="Main Navigation">
      <div class="container">
        <div class="d-flex align-items-center gap-3">
          <a class="navbar-brand d-flex align-items-center mb-0 me-0" href="https://sakibzyx.github.io/" aria-label="Home">
            <img src="/assets/img/md-sakibul-hasan.webp" height="36" width="36" style="object-fit: cover" alt="Md Sakibul Hasan Portfolio Logo" />
          </a>
          <a class="nav-cv-box" href="https://sakibzyx.github.io/cv/index" target="_blank" rel="noopener">CV</a>
        </div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link nav-box" href="https://sakibzyx.github.io/#about">About</a></li>
            <li class="nav-item"><a class="nav-link nav-box" href="https://sakibzyx.github.io/#education">Education</a></li>
            <li class="nav-item"><a class="nav-link nav-box" href="https://sakibzyx.github.io/#experience">Experience</a></li>
            <li class="nav-item"><a class="nav-link nav-box" href="https://sakibzyx.github.io/#activities">Activities</a></li>
            <li class="nav-item"><a class="nav-link nav-box active" href="https://sakibzyx.github.io/gallery" aria-current="page">Gallery</a></li>
            <li class="nav-item"><a class="nav-link nav-box" href="https://sakibzyx.github.io/#contact">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main id="main">
      <header class="hero-section hero-small">
        <div class="hero-slider" aria-hidden="true">
          <div class="hero-slide active" style="background-image: linear-gradient(135deg, #16222a, #3a6073)"></div>
          <div class="hero-slide" style="background-image: linear-gradient(135deg, #654ea3, #eaafc8)"></div>
          <div class="hero-slide" style="background-image: linear-gradient(135deg, #0f2027, #203a43, #2c5364)"></div>
        </div>
        <div class="hero-overlay" aria-hidden="true"></div>
        <div class="container hero-content">
          <h1 class="mb-1">Gallery</h1>
          <p class="mb-0 text-white-50">Certificates, project work, and site visits from my Civil Engineering journey at DUET.</p>
        </div>
      </header>

      <section class="py-5">
        <div class="container">
          <h2 class="section-title">Photos</h2>
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
            <div id="filters" class="d-flex flex-wrap gap-2" role="group" aria-label="Filter by category"></div>
            <div>
              <label for="search" class="visually-hidden">Search photos</label>
              <input id="search" type="search" class="form-control" placeholder="Search photos..." autocomplete="off" />
            </div>
          </div>
          <p id="status" class="small text-muted mb-4" role="status" aria-live="polite"></p>
          <div id="grid" class="row g-4"></div>
        </div>
      </section>
    </main>

    <dialog id="viewer" aria-label="Photo viewer">
      <button id="vclose" class="vbtn close" type="button" aria-label="Close">&times;</button>
      <button id="vprev" class="vbtn prev" type="button" aria-label="Previous photo">&lsaquo;</button>
      <figure>
        <img id="vimg" alt="" />
        <figcaption>
          <strong id="vtitle"></strong>
          <span id="vdesc"></span>
          <small id="vcount"></small>
        </figcaption>
      </figure>
      <button id="vnext" class="vbtn next" type="button" aria-label="Next photo">&rsaquo;</button>
    </dialog>

    <footer class="text-center">
      <div class="container">
        <p class="mb-0">&copy; <span id="copyright-year">2026</span> Md Sakibul Hasan. All Rights Reserved.</p>
      </div>
    </footer>

    <nav class="side-nav" aria-label="Quick navigation">
      <a href="https://sakibzyx.github.io/" data-label="Home" aria-label="Home"><i class="bi bi-house"></i></a>
      <a href="https://sakibzyx.github.io/cv/index" data-label="CV" aria-label="CV"><i class="bi bi-file-earmark-person"></i></a>
      <a href="https://sakibzyx.github.io/gallery" data-label="Gallery" aria-label="Gallery" class="active" aria-current="page"><i class="bi bi-images"></i></a>
    </nav>

    <a href="#" class="back-to-top" aria-label="Scroll back to top"><i class="bi bi-arrow-up" aria-hidden="true"></i></a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/gallery.js"></script>
  </body>
</html>
