<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2c3e50" />
    <title>Gallery | Md Sakibul Hasan</title>
    <meta name="description" content="Photo gallery of Md Sakibul Hasan, Civil Engineering student at DUET." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://sakibzyx.github.io/gallery" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sakibzyx.github.io/gallery" />
    <meta property="og:title" content="Gallery | Md Sakibul Hasan" />
    <meta property="og:image" content="https://sakibzyx.github.io/assets/img/og-image.jpg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/webp" href="/assets/img/md-sakibul-hasan.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" /></noscript>

    <style>
      :root { --primary-color: #2c3e50; --secondary-color: #3498db; --accent-color: #e74c3c; --dark-color: #2c3e50; }
      html { scroll-behavior: smooth; scroll-padding-top: 70px; }
      body { font-family: "Poppins", sans-serif; color: #333; line-height: 1.6; }

      /* Navbar */
      .navbar { background-color: var(--primary-color); padding: 12px 0; }
      .navbar-nav { gap: 6px; align-items: center; }
      .navbar-dark .navbar-nav .nav-link.nav-box, .nav-cv-box {
        display: inline-block; padding: 4px 12px; border: 2px solid rgba(255,255,255,0.85); border-radius: 4px;
        color: #fff; font-size: 0.9rem; font-weight: 600; line-height: 1.4; text-decoration: none; transition: all 0.25s ease;
      }
      .navbar-dark .navbar-nav .nav-link.nav-box:hover, .navbar-dark .navbar-nav .nav-link.nav-box:focus-visible,
      .nav-cv-box:hover, .nav-cv-box:focus-visible { background-color: #fff; color: var(--primary-color); transform: translateY(-2px); }
      .navbar-dark .navbar-nav .nav-link.nav-box.active { background-color: var(--secondary-color); border-color: var(--secondary-color); color: #fff; }
      @media (max-width: 991.98px) {
        .navbar-nav { padding-top: 12px; align-items: stretch; }
        .navbar-dark .navbar-nav .nav-link.nav-box { display: block; text-align: center; margin-bottom: 4px; }
      }

      /* Header */
      .page-hero { position: relative; color: #fff; padding: 50px 0; text-align: center; background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%); }

      .section-title { position: relative; margin-bottom: 35px; padding-bottom: 16px; font-weight: 700; font-size: 1.85rem; color: var(--primary-color); }
      .section-title::after { content: ""; position: absolute; bottom: 0; left: 0; width: 60px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--secondary-color), var(--accent-color)); }

      /* Gallery grid */
      .gallery-item { display: block; width: 100%; padding: 0; border: none; background: linear-gradient(135deg, #16222a, #3a6073); border-radius: 10px; overflow: hidden; position: relative; aspect-ratio: 4 / 3; box-shadow: 0 4px 14px rgba(0,0,0,0.08); transition: transform 0.25s ease, box-shadow 0.25s ease; }
      .gallery-item:hover, .gallery-item:focus-visible { transform: translateY(-4px); box-shadow: 0 8px 22px rgba(0,0,0,0.12); }
      .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .gallery-caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 12px 10px; color: #fff; font-size: 0.85rem; font-weight: 500; text-align: left; background: linear-gradient(transparent, rgba(0,0,0,0.65)); }
      #lightboxImg { max-height: 80vh; object-fit: contain; }

      footer { background-color: var(--dark-color); color: #fff; padding: 30px 0; }

      /* Floating side navigation */
      .side-nav { position: fixed; top: 50%; right: 12px; transform: translateY(-50%); z-index: 1000; display: flex; flex-direction: column; padding: 6px; background: #fff; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
      .side-nav a { position: relative; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; color: var(--secondary-color); font-size: 1.05rem; border-radius: 4px; text-decoration: none; transition: background-color 0.2s ease, color 0.2s ease; }
      .side-nav a:hover, .side-nav a:focus-visible, .side-nav a.active { background-color: var(--secondary-color); color: #fff; }
      .side-nav a::after { content: attr(data-label); position: absolute; right: 52px; top: 50%; transform: translateY(-50%); padding: 4px 10px; background: var(--primary-color); color: #fff; font-size: 0.78rem; white-space: nowrap; border-radius: 4px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
      .side-nav a:hover::after, .side-nav a:focus-visible::after { opacity: 1; }
      @media (max-width: 575.98px) {
        .side-nav { right: 6px; padding: 4px; }
        .side-nav a { width: 34px; height: 34px; font-size: 0.95rem; }
        .side-nav a::after { display: none; }
      }
    </style>
  </head>

  <body>
    <a class="visually-hidden-focusable" href="#main">Skip to main content</a>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top" aria-label="Main Navigation">
      <div class="container">
        <div class="d-flex align-items-center gap-3">
          <a class="navbar-brand d-flex align-items-center mb-0 me-0" href="https://sakibzyx.github.io/" aria-label="Home">
            <img src="/assets/img/md-sakibul-hasan.webp" height="36" width="36" style="object-fit: cover" alt="Md Sakibul Hasan Portfolio Logo" />
          </a>
          <a class="nav-cv-box" href="https://sakibzyx.github.io/cv/index" target="_blank" rel="noopener">CV</a>
        </div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link nav-box" href="https://sakibzyx.github.io/#about">About</a></li>
            <li class="nav-item"><a class="nav-link nav-box" href="https://sakibzyx.github.io/#education">Education</a></li>
            <li class="nav-item"><a class="nav-link nav-box" href="https://sakibzyx.github.io/#experience">Experience</a></li>
            <li class="nav-item"><a class="nav-link nav-box" href="https://sakibzyx.github.io/#activities">Activities</a></li>
            <li class="nav-item"><a class="nav-link nav-box active" href="https://sakibzyx.github.io/gallery" aria-current="page">Gallery</a></li>
            <li class="nav-item"><a class="nav-link nav-box" href="https://sakibzyx.github.io/#contact">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main id="main">
      <header class="page-hero">
        <div class="container">
          <h1 class="mb-1">Gallery</h1>
          <p class="mb-0 text-white-50">Moments from academics, projects and activities.</p>
        </div>
      </header>

      <section class="py-5">
        <div class="container">
          <h2 class="section-title">Photos</h2>
          <!-- Add photos: copy one <div class="col-6 col-md-4 col-lg-3"> block, change src, alt and caption -->
          <div class="row g-3">
            <div class="col-6 col-md-4 col-lg-3">
              <button class="gallery-item" type="button" data-bs-toggle="modal" data-bs-target="#lightbox">
                <img src="/assets/img/gallery/photo-1.webp" alt="Photo 1 caption" loading="lazy" />
                <span class="gallery-caption">Photo 1 caption</span>
              </button>
            </div>
            <div class="col-6 col-md-4 col-lg-3">
              <button class="gallery-item" type="button" data-bs-toggle="modal" data-bs-target="#lightbox">
                <img src="/assets/img/gallery/photo-2.webp" alt="Photo 2 caption" loading="lazy" />
                <span class="gallery-caption">Photo 2 caption</span>
              </button>
            </div>
            <div class="col-6 col-md-4 col-lg-3">
              <button class="gallery-item" type="button" data-bs-toggle="modal" data-bs-target="#lightbox">
                <img src="/assets/img/gallery/photo-3.webp" alt="Photo 3 caption" loading="lazy" />
                <span class="gallery-caption">Photo 3 caption</span>
              </button>
            </div>
            <div class="col-6 col-md-4 col-lg-3">
              <button class="gallery-item" type="button" data-bs-toggle="modal" data-bs-target="#lightbox">
                <img src="/assets/img/gallery/photo-4.webp" alt="Photo 4 caption" loading="lazy" />
                <span class="gallery-caption">Photo 4 caption</span>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Lightbox -->
    <div class="modal fade" id="lightbox" tabindex="-1" aria-label="Photo preview" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-dark text-white border-0">
          <div class="modal-header border-0 pb-0">
            <h2 class="modal-title h6" id="lightboxTitle"></h2>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center">
            <img id="lightboxImg" class="img-fluid rounded" alt="" />
          </div>
        </div>
      </div>
    </div>

    <footer class="text-center">
      <div class="container">
        <p class="mb-0">&copy; <span id="copyright-year">2026</span> Md Sakibul Hasan. All Rights Reserved.</p>
      </div>
    </footer>

    <!-- Floating side navigation -->
    <nav class="side-nav" aria-label="Quick navigation">
      <a href="https://sakibzyx.github.io/" data-label="Home" aria-label="Home"><i class="bi bi-house"></i></a>
      <a href="https://sakibzyx.github.io/cv/index" data-label="CV" aria-label="CV"><i class="bi bi-file-earmark-person"></i></a>
      <a href="https://sakibzyx.github.io/gallery" data-label="Gallery" aria-label="Gallery" class="active" aria-current="page"><i class="bi bi-images"></i></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById("copyright-year").textContent = new Date().getFullYear();

      // Lightbox: show clicked photo
      document.getElementById("lightbox").addEventListener("show.bs.modal", (e) => {
        const img = e.relatedTarget.querySelector("img");
        const big = document.getElementById("lightboxImg");
        big.src = img.src;
        big.alt = img.alt;
        document.getElementById("lightboxTitle").textContent = img.alt;
      });
    </script>
  </body>
</html>
